name: SideStore source
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty selects newest published Release)'
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'sidestore/**'
      - 'scripts/*sidestore*'
      - '.github/workflows/sidestore-source.yml'
  pull_request:
    paths:
      - 'sidestore/**'
      - 'scripts/*sidestore*'
      - '.github/workflows/sidestore-source.yml'
permissions:
  contents: read
concurrency:
  group: sidestore-source-${{ github.event_name == 'pull_request' && github.event.number || 'publish' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_sidestore_source.py --check
      - run: python -m unittest discover -s scripts -p test_sidestore_source.py -v
      - name: Verify current Release against committed source
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/update_sidestore_source.py
          git diff --exit-code -- sidestore/source.json
  update:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate published IPA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/update_sidestore_source.py --tag "$RELEASE_TAG"
          else
            python scripts/update_sidestore_source.py
          fi
      - run: python scripts/update_sidestore_source.py --check
      - name: Commit source only when changed
        run: |
          if ! git diff --quiet -- sidestore/source.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sidestore/source.json
            git commit -m 'Update SideStore source from verified Release IPA'
            git push origin HEAD:main
          fi

name: TiebaLite

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "26.6"
  defaultConfig: Debug
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  UITesting: debug

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  UITesting: Config/UITesting.xcconfig

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1

fileGroups:
  - Resources

targets:
  GeneratedProtobuf:
    type: library.static
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Generated/Protobuf
        excludes:
          - GENERATION_METADATA.txt
          - GENERATED_SHA256SUMS
    dependencies:
      - package: SwiftProtobuf
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: GeneratedProtobuf
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO

  TiebaLite:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
        excludes:
          - AGENTS.md
      - path: Sources/Core
        excludes:
          - AGENTS.md
      - path: Sources/DesignSystem
        excludes:
          - AGENTS.md
      - path: Sources/Features/Recommendations
      - path: Sources/Features/ThreadReader
      - path: Sources/Features/MediaViewer
      - path: Sources/Features/Session
      - path: Sources/InteractionKit
        excludes:
          - AGENTS.md
      - path: TestSupport/LaunchScenarios
        group: TestSupport
    dependencies:
      - target: GeneratedProtobuf
      - package: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TiebaLite
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(TIEBALITE_APP_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: TiebaLite
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) Harness*.swift LaunchScenario*.swift"
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) Debug*.swift InteractionLab*.swift Harness*.swift LaunchScenario*.swift"
        UITesting:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG UITESTING"

  TiebaLiteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
        excludes:
          - AGENTS.md
      - path: TestSupport
        excludes:
          - AGENTS.md
          - Fixtures
      - path: TestSupport/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: TiebaLite
      - target: GeneratedProtobuf
      - package: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(TIEBALITE_APP_BUNDLE_IDENTIFIER).tests"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TEST_SUPPORT"

  TiebaLiteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
        excludes:
          - AGENTS.md
    dependencies:
      - target: TiebaLite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(TIEBALITE_APP_BUNDLE_IDENTIFIER).uitests"

schemes:
  TiebaLite:
    build:
      targets:
        TiebaLite: all
    run:
      config: Debug
    test:
      config: UITesting
      gatherCoverageData: false
      testPlans:
        - path: Config/TestPlans/TiebaLite.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
